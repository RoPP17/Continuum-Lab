<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Continuum Lab | Three.js 3D Viewport</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #060709;
      color: #e2e8f0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    #viewport-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #hud-overlay {
      position: absolute;
      top: 24px;
      left: 24px;
      background: rgba(10, 14, 23, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 240, 255, 0.25);
      border-radius: 8px;
      padding: 16px 20px;
      pointer-events: none;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }
    #hud-overlay h1 {
      margin: 0 0 4px 0;
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #00f0ff;
    }
    #hud-overlay p {
      margin: 0;
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
  <!-- Three.js + OrbitControls from fast CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <div id="viewport-container">
    <div id="hud-overlay">
      <h1>Continuum Lab // Three.js Engine</h1>
      <p id="stats">Active Simulation: 3D Torus Vortex</p>
    </div>
  </div>

  <script>
    const container = document.getElementById('viewport-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x060709, 0.05);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 3, 6);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambientLight);

    const pointLight1 = new THREE.PointLight(0x00f0ff, 2.5, 50);
    pointLight1.position.set(5, 5, 5);
    scene.add(pointLight1);

    const pointLight2 = new THREE.PointLight(0xff007f, 2.0, 50);
    pointLight2.position.set(-5, -3, -5);
    scene.add(pointLight2);

    // Geometry & Material
    const geometry = new THREE.TorusKnotGeometry(1.6, 0.4, 128, 32);
    const material = new THREE.MeshStandardMaterial({
      color: 0x112233,
      emissive: 0x002233,
      roughness: 0.15,
      metalness: 0.85,
      wireframe: false
    });
    const mesh = new THREE.Mesh(geometry, material);
    scene.add(mesh);

    // Particle Cloud
    const particleCount = 2000;
    const particleGeo = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);
    for (let i = 0; i < particleCount * 3; i += 3) {
      positions[i] = (Math.random() - 0.5) * 15;
      positions[i + 1] = (Math.random() - 0.5) * 15;
      positions[i + 2] = (Math.random() - 0.5) * 15;
    }
    particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const particleMat = new THREE.PointsMaterial({
      color: 0x00f0ff,
      size: 0.04,
      transparent: true,
      opacity: 0.6
    });
    const particles = new THREE.Points(particleGeo, particleMat);
    scene.add(particles);

    // Animation Loop
    let clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const elapsedTime = clock.getElapsedTime();
      
      mesh.rotation.x = elapsedTime * 0.3;
      mesh.rotation.y = elapsedTime * 0.5;
      particles.rotation.y = elapsedTime * 0.05;
      
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
