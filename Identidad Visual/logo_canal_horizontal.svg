<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 800" width="100%" height="100%">
  
  <defs>
    <radialGradient id="bgDark" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0a1220" />
      <stop offset="100%" stop-color="#04060a" />
    </radialGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="45%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="cyanGradFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.9" />
      <stop offset="65%" stop-color="#0284c7" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0.0" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
  <g id="airfoil-mark">
    <!-- Outer Aerodynamic Foil Shell -->
    <path d="M 210 540 C 185 530, 175 490, 205 450 C 245 400, 340 360, 480 365 C 610 370, 720 405, 835 450 C 740 458, 620 460, 520 472 C 410 485, 310 515, 255 550 C 235 560, 215 555, 210 540 Z" fill="none" stroke="url(#cyanGrad)" stroke-width="16" stroke-linejoin="round" stroke-linecap="round" />
    <!-- Upper Boundary Layer Laminar Curve -->
    <path d="M 230 465 C 280 415, 380 380, 500 385 C 610 390, 715 425, 825 455" fill="none" stroke="#00f0ff" stroke-width="8" stroke-linecap="round" opacity="0.85" />
    <!-- Core Cavity Negative Space / Recirculation Foil -->
    <path d="M 330 490 C 410 440, 500 445, 530 480 C 480 500, 400 515, 330 490 Z" fill="none" stroke="url(#cyanGrad)" stroke-width="12" stroke-linejoin="round" />
    <!-- Lower Wake Streamlines -->
    <path d="M 360 515 C 470 510, 600 485, 805 465" fill="none" stroke="url(#cyanGradFade)" stroke-width="9" stroke-linecap="round" />
    <path d="M 400 540 C 490 535, 620 505, 780 480" fill="none" stroke="url(#cyanGradFade)" stroke-width="8" stroke-linecap="round" />
    <path d="M 440 565 C 520 558, 630 528, 755 498" fill="none" stroke="url(#cyanGradFade)" stroke-width="7" stroke-linecap="round" />
    <path d="M 470 590 C 540 580, 635 550, 725 520" fill="none" stroke="url(#cyanGradFade)" stroke-width="6" stroke-linecap="round" />
  </g>

  </defs>

  <rect width="2400" height="800" fill="url(#bgDark)" />
  <g transform="translate(180, 150) scale(0.9)" filter="url(#neonGlow)">
    <use href="#airfoil-mark" transform="translate(-180, -340)" />
  </g>
  <g transform="translate(880, 420)">
    <text x="0" y="0" font-family="'Bahnschrift', 'Segoe UI', -apple-system, sans-serif" font-weight="700" font-size="108" letter-spacing="12" fill="#ffffff">CONTINUUM LAB</text>
    <text x="6" y="80" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="400" font-size="34" letter-spacing="18" fill="#00f0ff" opacity="0.9">COMPUTATIONAL PHYSICS</text>
  </g>
</svg>